[project]
name = "churn-predictor"
version = "0.1.0"
description = "Telecom churn predictor: Logistic Regression baseline vs Random Forest champion, trained once, served in Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn>=1.6",
    "streamlit>=1.40",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
extend-exclude = ["common"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
